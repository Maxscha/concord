[project]
name = "concord-train"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.5",
    "transformers",
    "tokenizers",
    "datasets",
    "accelerate",
    "sentencepiece",
    "peft",
    "trl>=0.22,<1",
    "wandb",
    "simple-parsing",
    "numpy",
    "pandas",
    "tqdm",
    "hf-xet",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
ignore = ["E203", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
